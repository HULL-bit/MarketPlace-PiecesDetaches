<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core">
<head>
    <meta charset="UTF-8" />
    <title>Dashboard Mécanicien - AutoPieces Pro</title>
    <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/css/marketplace-theme.css" />
    <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/resources/vendor/fontawesome/css/all.min.css" />
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-brand">Mécanicien</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#{facesContext.externalContext.requestContextPath}/mecanicien/dashboard" class="nav-item active"><i class="fas fa-home"></i> Tableau de bord</a>
                <a href="#{facesContext.externalContext.requestContextPath}/logout" class="nav-item"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <h1>Dashboard Mécanicien</h1>
                <span class="date-display">#{currentDate}</span>
            </header>
            <div class="dashboard-content">
                <div class="content-card">
                    <div class="card-body">
                        <h2>Gestion des Interventions</h2>
                        <p>Bienvenue dans votre espace mécanicien.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
