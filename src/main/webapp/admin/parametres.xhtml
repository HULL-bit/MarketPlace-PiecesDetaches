<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui" xmlns:c="http://java.sun.com/jsp/jstl/core" xmlns:fn="http://java.sun.com/jsp/jstl/functions">
<head>
    <ui:include src="/WEB-INF/fragments/adminHead.xhtml"/>
</head>
<body class="admin-body">
<div class="admin-layout">
    <ui:include src="/WEB-INF/fragments/adminSidebar.xhtml"><ui:param name="adminNav" value="parametres"/></ui:include>
    <div class="admin-main">
        <ui:include src="/WEB-INF/fragments/adminTopbar.xhtml"/>
        <div class="admin-content">
            <c:if test="#{not empty success}">
                <div class="admin-alert success"><i class="fas fa-check-circle"></i> #{success}</div>
            </c:if>
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3 class="admin-card-title">Configuration générale (démonstration)</h3>
                </div>
                <div style="padding: 1.5rem;">
                    <form method="POST" action="#{facesContext.externalContext.requestContextPath}/admin/parametres">
                        <div class="form-group">
                            <label>Nom de l'application</label>
                            <input type="text" name="appName" value="AutoPieces Pro"/>
                        </div>
                        <div class="form-group">
                            <label>E-mail administrateur</label>
                            <input type="email" name="adminEmail" value="admin@marketplace.com"/>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
