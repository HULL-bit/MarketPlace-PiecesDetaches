<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:fn="http://java.sun.com/jsp/jstl/functions">
<c:if test="#{not empty success}">
                <div class="admin-alert success"><i class="fas fa-check-circle"></i> #{success}</div>
            </c:if>

            <div class="profile-header-card">
                <img src="#{currentAdminAvatarUrl}" alt="" class="profile-avatar-lg" style="object-fit:cover;" />
                <div>
                    <h2 style="font-size:1.35rem;margin-bottom:0.35rem;">#{user.prenom} #{user.nom}</h2>
                    <p style="color:var(--admin-muted, #7f8c8d);"><i class="fas fa-envelope"></i> #{user.email}</p>
                    <p style="color:var(--admin-muted, #7f8c8d);"><i class="fas fa-user-shield"></i> #{user.role} · #{user.login}</p>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h3 class="admin-card-title">#{msg['admin.self.cardEdit']}</h3>
                </div>
                <div style="padding: 1.5rem;">
                    <form action="#{facesContext.externalContext.requestContextPath}/admin/profil/update" method="post">
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldLastName']}</label>
                            <input type="text" name="nom" value="#{user.nom}" required="required"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldFirstName']}</label>
                            <input type="text" name="prenom" value="#{user.prenom}" required="required"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldEmail']}</label>
                            <input type="email" name="email" value="#{user.email}" required="required"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldPhone']}</label>
                            <input type="text" name="telephone" value="#{user.tel ne null ? user.tel : ''}" placeholder="#{msg['form.register.field.phone.optional']}"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldPhone2']}</label>
                            <input type="text" name="telephone2" value="#{user.tel2 ne null ? user.tel2 : ''}" placeholder="#{msg['form.register.field.phone.optional']}"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldGender']}</label>
                            <select name="sexe" id="profilSexe">
                                <option value="">#{msg['admin.users.genderUnset']}</option>
                                <option value="H">#{msg['admin.users.genderM']}</option>
                                <option value="F">#{msg['admin.users.genderF']}</option>
                            </select>
                            <script type="text/javascript">
                                //<![CDATA[
                                (function () {
                                    var s = document.getElementById('profilSexe');
                                    if (!s) return;
                                    var v = '#{user.sexe == null ? "" : user.sexe}';
                                    s.value = v;
                                })();
                                //]]>
                            </script>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldBirthDate']}</label>
                            <input type="date" name="datenaiss" value="#{user.datenaiss ne null ? user.datenaiss : ''}"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldBirthPlace']}</label>
                            <input type="text" name="lieunaiss" value="#{user.lieunaiss}"/>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldAddress']}</label>
                            <textarea name="adresse" rows="3">#{user.adresse}</textarea>
                        </div>
                        <div class="form-group">
                            <label>#{msg['admin.self.fieldPassword']}</label>
                            <input type="password" name="motpasse" placeholder="#{msg['admin.self.fieldPasswordHint']}" autocomplete="new-password"/>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> #{msg['admin.self.save']}</button>
                        </div>
                    </form>
                </div>
            </div>
</ui:composition>
