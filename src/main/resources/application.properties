
spring.datasource.url=jdbc:postgresql://localhost:5432/PiecesDB
spring.datasource.username=postgres
spring.datasource.password=Password
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:db/data.sql,classpath:db/data_extended.sql
spring.sql.init.continue-on-error=true


spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Disable default Spring Boot view resolver
spring.mvc.view.prefix=
spring.mvc.view.suffix=

# Vues : Facelets (XHTML) servies sous webapp ; forwards Spring vers *.xhtml
# spring.mvc.view.prefix=/WEB-INF/views/
# spring.mvc.view.suffix=.jsp

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB


upload.dir=/opt/marketplace/uploads/
images.dir=/opt/marketplace/uploads/images/


server.port=8080
server.servlet.context-path=/pieces-auto

# Static Resources Configuration
spring.mvc.static-path-pattern=/resources/**
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
spring.web.resources.cache.period=3600
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
spring.web.resources.add-mappings=true
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false


logging.level.com.marketplace=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false


default.locale=fr


gqrcode.size=300
gqrcode.format=PNG


spring.cache.type=simple


jwt.secret=marketplaceSecretKeyForJwtTokenGeneration2024SecureKey1234567890
jwt.expiration=86400000


jasperreports.templates.path=/reports/


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=marketplace@gmail.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.devtools.restart.enabled=true
